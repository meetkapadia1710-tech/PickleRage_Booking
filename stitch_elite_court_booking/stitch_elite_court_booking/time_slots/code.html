<style>
        .slot-chip {
            transition: all 0.2s ease-in-out;
        }
        .slot-chip.selected {
            background-color: theme('colors.primary');
            color: theme('colors.on-primary');
            border-color: theme('colors.primary');
        }
        .slot-chip.unavailable {
            opacity: 0.3;
            pointer-events: none;
            background-color: theme('colors.surface-variant');
            border-color: transparent;
        }
        
        /* Ambient shadow for the bottom action bar */
        .ambient-shadow-top {
            box-shadow: 0 -4px 20px rgba(0, 52, 43, 0.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-background dark:bg-on-background w-full top-0 sticky z-10">
<div class="flex justify-between items-center px-margin-main h-touch-target w-full">
<div class="flex items-center gap-2 hover:bg-surface-container-high transition-colors rounded-full p-1 cursor-pointer" onclick="history.back()">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="arrow_back">arrow_back</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed font-bold">AceCourt</h1>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface-variant dark:text-outline-variant cursor-pointer hover:bg-surface-container-high transition-colors rounded-full p-1" data-icon="notifications">notifications</span>
</div>
</div>
</header>
<main class="flex-1 overflow-y-auto pb-[100px]">
<div class="max-w-3xl mx-auto px-margin-main pt-stack-md">
<!-- Context Header -->
<div class="mb-stack-lg">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm">Select Time</h2>
<div class="flex items-center text-on-surface-variant gap-2 font-body-md text-body-md">
<span class="material-symbols-outlined text-[18px]" data-icon="sports_tennis">sports_tennis</span>
<span>Downtown Indoor Courts • Court 3</span>
</div>
</div>
<!-- Date Scroller -->
<div class="mb-stack-lg flex overflow-x-auto gap-stack-md pb-2 no-scrollbar snap-x">
<!-- Past Date -->
<div class="flex flex-col items-center justify-center min-w-[60px] h-[72px] rounded-xl bg-surface-container-low text-on-surface-variant opacity-50 snap-start">
<span class="font-label-md text-label-md uppercase">Mon</span>
<span class="font-headline-sm text-headline-sm mt-1">12</span>
</div>
<!-- Selected Date -->
<div class="flex flex-col items-center justify-center min-w-[60px] h-[72px] rounded-xl bg-primary text-on-primary snap-start relative shadow-[0_4px_12px_rgba(0,52,43,0.15)]">
<span class="font-label-md text-label-md uppercase">Tue</span>
<span class="font-headline-sm text-headline-sm mt-1">13</span>
<div class="absolute bottom-1 w-1.5 h-1.5 rounded-full bg-secondary-container"></div>
</div>
<!-- Future Dates -->
<div class="flex flex-col items-center justify-center min-w-[60px] h-[72px] rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer snap-start">
<span class="font-label-md text-label-md uppercase">Wed</span>
<span class="font-headline-sm text-headline-sm mt-1">14</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[60px] h-[72px] rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer snap-start">
<span class="font-label-md text-label-md uppercase">Thu</span>
<span class="font-headline-sm text-headline-sm mt-1">15</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[60px] h-[72px] rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer snap-start">
<span class="font-label-md text-label-md uppercase">Fri</span>
<span class="font-headline-sm text-headline-sm mt-1">16</span>
</div>
<div class="flex flex-col items-center justify-center min-w-[60px] h-[72px] rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer snap-start">
<span class="font-label-md text-label-md uppercase">Sat</span>
<span class="font-headline-sm text-headline-sm mt-1">17</span>
</div>
</div>
<!-- Slots Container -->
<div class="space-y-stack-lg">
<!-- Morning Section -->
<section>
<div class="flex items-center gap-2 mb-stack-md">
<span class="material-symbols-outlined text-primary" data-icon="light_mode">light_mode</span>
<h3 class="font-headline-sm text-headline-sm text-primary">Morning</h3>
</div>
<div class="grid grid-cols-3 md:grid-cols-4 gap-gutter">
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            06:00
                        </button>
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            07:00
                        </button>
<button class="slot-chip unavailable h-touch-target rounded-[12px] text-on-surface font-label-lg text-label-lg flex items-center justify-center">
<span class="line-through">08:00</span>
</button>
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            09:00
                        </button>
<button class="slot-chip selected h-touch-target rounded-[12px] font-label-lg text-label-lg flex items-center justify-center border">
                            10:00
                        </button>
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">

</section>

<h3 class="font-headline-sm text-headline-sm text-primary">Afternoon</h3>
</div>
<div class="grid grid-cols-3 md:grid-cols-4 gap-gutter">
<button class="slot-chip unavailable h-touch-target rounded-[12px] text-on-surface font-label-lg text-label-lg flex items-center justify-center">
<span class="line-through">12:00</span>
</button>
<button class="slot-chip unavailable h-touch-target rounded-[12px] text-on-surface font-label-lg text-label-lg flex items-center justify-center">
<span class="line-through">13:00</span>
</button>
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            14:00
                        </button>
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            15:00
                        </button>
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            16:00
                        </button>
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            17:00
                        </button>
</div>
</section>
<!-- Evening Section -->
<section>
<div class="flex items-center gap-2 mb-stack-md">
<span class="material-symbols-outlined text-primary" data-icon="nights_stay">nights_stay</span>
<h3 class="font-headline-sm text-headline-sm text-primary">Evening</h3>
</div>
<div class="grid grid-cols-3 md:grid-cols-4 gap-gutter">
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            18:00
                        </button>
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            19:00
                        </button>
<button class="slot-chip unavailable h-touch-target rounded-[12px] text-on-surface font-label-lg text-label-lg flex items-center justify-center">
<span class="line-through">20:00</span>
</button>
<button class="slot-chip h-touch-target rounded-[12px] bg-[#F1F3F4] text-on-surface font-label-lg text-label-lg flex items-center justify-center border border-transparent">
                            21:00
                        </button>
<button class="slot-chip unavailable h-touch-target rounded-[12px] text-on-surface font-label-lg text-label-lg flex items-center justify-center">
<span class="line-through">22:00</span>
</button>
</div>
</section>
</div>
</div>
</main>
<!-- Floating Action Area (Confirm Selection) -->
<div class="fixed bottom-0 w-full z-50 bg-surface-container-lowest ambient-shadow-top pb-safe">
<div class="max-w-3xl mx-auto px-margin-main py-stack-md flex justify-between items-center">
<div>
<p class="font-label-md text-label-md text-on-surface-variant">Selected</p>
<p class="font-headline-sm text-headline-sm text-primary">10:00 - 11:00</p>
</div>
<button class="h-touch-target px-8 rounded-full bg-secondary-container text-on-secondary-container font-label-lg text-label-lg font-bold flex items-center justify-center shadow-[0_4px_12px_rgba(255,191,0,0.2)] hover:opacity-90 active:scale-95 transition-all">
                Confirm Selection
            </button>
</div>
</div>
<style>
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
<script>
        // Simple script to toggle slot selection for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const slots = document.querySelectorAll('.slot-chip:not(.unavailable)');
            
            slots.forEach(slot => {
                slot.addEventListener('click', () => {
                    // Remove selected class from all
                    slots.forEach(s => s.classList.remove('selected'));
                    slots.forEach(s => s.classList.add('bg-[#F1F3F4]'));
                    
                    // Add selected class to clicked
                    slot.classList.add('selected');
                    slot.classList.remove('bg-[#F1F3F4]');
                    
                    // Update bottom bar text
                    const timeText = slot.textContent.trim();
                    // Assuming 1 hour slots for demo
                    const endHour = parseInt(timeText.split(':')[0]) + 1;
                    const endTime = `${endHour.toString().padStart(2, '0')}:00`;
                    
                    document.querySelector('.fixed.bottom-0 p.font-headline-sm').textContent = `${timeText} - ${endTime}`;
                });
            });
        });
    </script>
</body></html>
