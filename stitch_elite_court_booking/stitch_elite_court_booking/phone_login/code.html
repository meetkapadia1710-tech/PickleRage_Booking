<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-group {
            position: relative;
        }
        .input-group label {
            position: absolute;
            top: 50%;
            left: 12px;
            transform: translateY(-50%);
            background: white;
            padding: 0 4px;
            transition: all 0.2s ease;
            pointer-events: none;
            color: var(--color-on-surface-variant);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16px;
        }
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0;
            font-size: 12px;
            color: var(--color-primary);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-lg">
<main class="flex-1 flex flex-col justify-center px-margin-main pb-stack-lg max-w-md mx-auto w-full relative">
<div class="absolute top-8 left-margin-main flex items-center space-x-2">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">sports_tennis</span>
<span class="font-headline-sm text-headline-sm text-primary font-bold">AceCourt</span>
</div>
<div class="mt-24 space-y-stack-lg">
<div class="space-y-stack-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background">Welcome</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your phone number to continue</p>
</div>
<div class="space-y-stack-md pt-4">
<div class="flex items-center gap-2">
<div class="h-touch-target px-4 border-[1.5px] border-outline-variant rounded-xl flex items-center justify-center bg-surface-container-lowest text-on-surface">
<span class="font-body-lg text-body-lg">+1</span>
</div>
<div class="input-group flex-1 h-touch-target">
<input class="w-full h-full border-[1.5px] border-outline-variant rounded-xl px-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest text-on-surface font-body-lg transition-colors" id="phone" placeholder=" " type="tel"/>
<label for="phone">Phone number</label>
</div>
</div>
<button class="w-full h-touch-target bg-secondary-container text-primary rounded-btn font-label-lg text-label-lg flex items-center justify-center hover:opacity-90 transition-opacity active:scale-95 duration-100 shadow-sm">
                    Continue
                </button>
</div>
<div class="text-center pt-stack-sm">
<p class="font-label-md text-label-md text-on-surface-variant">By continuing, you agree to our Terms &amp; Conditions</p>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('phone');
            input.addEventListener('input', function (e) {
                let x = e.target.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
                e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
            });
        });
    </script>
</body></html>
