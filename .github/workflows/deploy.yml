name: Deploy to Firebase

on:
  push:
    branches: [main]

# Only one deploy runs at a time; concurrent deploys are queued and the
# oldest pending run is cancelled.
concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests (gate)
        run: npm test

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WALLET_ISSUER_ID: ${{ secrets.VITE_WALLET_ISSUER_ID }}
          VITE_WALLET_CLIENT_EMAIL: ${{ secrets.VITE_WALLET_CLIENT_EMAIL }}
          VITE_WALLET_PRIVATE_KEY: ${{ secrets.VITE_WALLET_PRIVATE_KEY }}
        run: npm run build

      - name: Deploy Firestore rules & indexes
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          # Only deploy hosting here; run `firebase deploy --only firestore,functions`
          # separately or add a dedicated step if you want to include them.
          channelId: live

      # Optional: notify Slack on deploy failure
      # - name: Notify Slack
      #   if: failure()
      #   uses: rtCamp/action-slack-notify@v2
      #   env:
      #     SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      #     SLACK_MESSAGE: "PlayHub deploy FAILED on main"
